name: Release candidate artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed candidate version
        required: true
        type: string

permissions: {}
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package and attest RC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require reviewed candidate tag and manifest
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EXPECTED_REF: refs/tags/v0.1.0-rc.2
        run: |
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$REQUESTED_VERSION" = '0.1.0-rc.2'
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/energy_usage/manifest.json').read_text())
          assert manifest['version'] == '0.1.0-rc.2'
          assert manifest['requirements'] == []
          PY
      - name: Build deterministic archive and checksum
        run: |
          mkdir -p dist
          python scripts/build_release.py \
            --version 0.1.0-rc.2 \
            --commit "$GITHUB_SHA" \
            --output dist/ha-energy-usage-0.1.0-rc.2.zip
          cd dist
          sha256sum ha-energy-usage-0.1.0-rc.2.zip > ha-energy-usage-0.1.0-rc.2.zip.sha256
          sha256sum --check ha-energy-usage-0.1.0-rc.2.zip.sha256
          python - <<'PY'
          import json
          import re
          import subprocess
          import zipfile
          from pathlib import Path
          name = 'ha-energy-usage-0.1.0-rc.2.zip'
          line = Path(name + '.sha256').read_text()
          assert re.fullmatch(r'[0-9a-f]{64}  ' + re.escape(name) + r'\n', line)
          expected = set(subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', 'HEAD', 'custom_components/energy_usage'], cwd='..', text=True).splitlines())
          expected.add('custom_components/energy_usage/release.json')
          with zipfile.ZipFile(name) as archive:
              members = archive.namelist()
              assert set(members) == expected
              assert all(item.startswith('custom_components/energy_usage/') for item in members)
              release = json.loads(archive.read('custom_components/energy_usage/release.json'))
              manifest = json.loads(archive.read('custom_components/energy_usage/manifest.json'))
              assert release == {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd='..', text=True).strip(), 'version': '0.1.0-rc.2'}
              assert manifest['domain'] == 'energy_usage'
              assert manifest['version'] == release['version']
          PY
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/ha-energy-usage-0.1.0-rc.2.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ha-energy-usage-0.1.0-rc.2
          path: |
            dist/ha-energy-usage-0.1.0-rc.2.zip
            dist/ha-energy-usage-0.1.0-rc.2.zip.sha256
          if-no-files-found: error
