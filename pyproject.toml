[project]
name = "ha-energy-usage"
version = "0.1.0-rc.2"
description = "Development environment for the provider-neutral Energy Usage integration"
requires-python = ">=3.14,<3.15"
dependencies = [
  "homeassistant==2026.9.4",
]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pytest-cov==7.1.0",
  "pytest-homeassistant-custom-component==0.13.367",
  "ruff==0.16.9",
]

[tool.uv]
required-version = "==0.12.19"
package = false
environments = ["python_full_version >= '3.14.2' and python_version == '3.14'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["custom_components.energy_usage"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py314"
src = ["custom_components", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"custom_components/energy_usage/config_flow.py" = ["I001"]
"custom_components/energy_usage/coordinator.py" = ["I001"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/energy_usage", "tests"]
strict = true
warn_unused_configs = true
show_error_codes = true
